version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bsdk-clubs-postgres
    environment:
      POSTGRES_USER: bsdk_user
      POSTGRES_PASSWORD: bsdk_dev_password
      POSTGRES_DB: bsdk_clubs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/schema.postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql

  redis:
    image: redis:7-alpine
    container_name: bsdk-clubs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
